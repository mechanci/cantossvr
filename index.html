<!DOCTYPE html>
<html>
<head>
  <title>VR Can Toss</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #resetBtn {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 999; padding: 12px 24px; font-size: 18px; font-family: sans-serif;
      background: #222; color: white; border: none; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>
<button id="resetBtn" onclick="resetScene()">Reset Cans</button>

<a-scene physics="debug: false; gravity: -9.8" background="color: #87CEEB" webxr="optionalFeatures: local-floor">

  <!-- Explicit lights so objects are lit in VR too -->
  <a-entity light="type: ambient; color: #fff; intensity: 0.7"></a-entity>
  <a-entity light="type: directional; color: #fff; intensity: 0.8" position="-1 4 2"></a-entity>

  <!-- Ground -->
  <a-plane position="0 0 -3" rotation="-90 0 0" width="20" height="30"
    color="#4a7c3f" static-body></a-plane>

  <!-- Target table (top surface at y = 0.8) -->
  <a-box id="table" position="0 0.4 -4" width="2.2" height="0.8" depth="0.9"
    color="#8b5a2b" static-body></a-box>

  <!-- Cans (built by script, resting on the table) -->
  <a-entity id="canTower"></a-entity>

  <!-- Throwing line marker -->
  <a-ring position="0 0.01 -1" rotation="-90 0 0" radius-inner="0.4" radius-outer="0.5" color="white"></a-ring>

  <!-- Pedestal holding the balls (top at y = 0.9) -->
  <a-cylinder position="0 0.45 -0.8" radius="0.4" height="0.9" color="#555" static-body></a-cylinder>
  <a-entity id="balls"></a-entity>

  <a-sky color="#87CEEB" radius="150"></a-sky>

  <!-- Camera rig with hand controls -->
  <a-entity id="rig" position="0 0 0">
    <a-entity camera="far: 200" position="0 1.6 0" look-controls wasd-controls></a-entity>
    <a-entity id="leftHand" hand-controls="hand: left" hand-grabber></a-entity>
    <a-entity id="rightHand" hand-controls="hand: right" hand-grabber></a-entity>
  </a-entity>

</a-scene>

<script>
  const BALL_RADIUS = 0.1;
  const GRAB_RANGE = 0.3;
  const TABLE_TOP = 0.8;
  const PEDESTAL_TOP = 0.9;

  // Grab with trigger or grip: nearest ball within reach follows the hand,
  // and is released with the hand's velocity so it can be thrown.
  AFRAME.registerComponent('hand-grabber', {
    init: function () {
      this.held = null;
      this.prev = new THREE.Vector3();
      this.pos = new THREE.Vector3();
      this.vel = new THREE.Vector3();
      this.hasPrev = false;
      ['triggerdown', 'gripdown'].forEach(e => this.el.addEventListener(e, () => this.grab()));
      ['triggerup', 'gripup'].forEach(e => this.el.addEventListener(e, () => this.release()));
    },
    grab: function () {
      if (this.held) return;
      this.el.object3D.getWorldPosition(this.pos);
      let best = null, bestD = GRAB_RANGE;
      const p = new THREE.Vector3();
      document.querySelectorAll('.grabbable').forEach(b => {
        if (!b.body || b.heldBy) return;
        b.object3D.getWorldPosition(p);
        const d = p.distanceTo(this.pos);
        if (d < bestD) { best = b; bestD = d; }
      });
      if (best) { this.held = best; best.heldBy = this; }
    },
    release: function () {
      const b = this.held;
      if (!b) return;
      this.held = null;
      b.heldBy = null;
      if (b.body) {
        b.body.velocity.set(this.vel.x, this.vel.y, this.vel.z);
        b.body.wakeUp();
      }
    },
    tick: function (t, dt) {
      if (!dt) return;
      this.el.object3D.getWorldPosition(this.pos);
      if (this.hasPrev) {
        // smoothed hand velocity in m/s
        const inst = this.pos.clone().sub(this.prev).multiplyScalar(1000 / dt);
        this.vel.lerp(inst, 0.5);
      }
      this.prev.copy(this.pos);
      this.hasPrev = true;
      const b = this.held;
      if (b && b.body) {
        b.body.position.set(this.pos.x, this.pos.y, this.pos.z);
        b.body.velocity.set(0, 0, 0);
        b.body.angularVelocity.set(0, 0, 0);
      }
    }
  });

  function makeBall(x, y, z) {
    const ball = document.createElement('a-sphere');
    ball.setAttribute('radius', BALL_RADIUS);
    ball.setAttribute('color', '#f1c34e');
    ball.setAttribute('position', `${x} ${y} ${z}`);
    ball.setAttribute('dynamic-body', 'mass: 0.3; shape: sphere; linearDamping: 0.05; angularDamping: 0.2');
    ball.classList.add('grabbable');
    document.getElementById('balls').appendChild(ball);
    return ball;
  }

  function spawnBalls() {
    document.getElementById('balls').innerHTML = '';
    for (let i = 0; i < 4; i++) {
      makeBall(i * 0.2 - 0.3, PEDESTAL_TOP + BALL_RADIUS + 0.02, -0.8);
    }
  }

  // Pyramid of 6 / 3 / 1 cans sitting on the table
  function buildTower() {
    const tower = document.getElementById('canTower');
    tower.innerHTML = '';
    const r = 0.15, h = 0.3, gap = 0.01;
    const s = r * 2 + 0.02; // centre spacing within a row
    let id = 0;
    const add = (x, y, z) => {
      const can = document.createElement('a-cylinder');
      can.setAttribute('radius', r);
      can.setAttribute('height', h);
      can.setAttribute('color', id++ % 2 === 0 ? '#c0392b' : '#bdc3c7');
      can.setAttribute('position', `${x} ${y} ${z}`);
      can.setAttribute('dynamic-body', 'mass: 0.3; shape: cylinder; linearDamping: 0.2; angularDamping: 0.2');
      tower.appendChild(can);
    };
    const y0 = TABLE_TOP + h / 2 + gap;
    for (let i = 0; i < 6; i++) add((i - 2.5) * s, y0, -4);
    for (let i = 0; i < 3; i++) add((i - 1) * 2 * s, y0 + h + gap, -4);
    add(0, y0 + 2 * (h + gap), -4);
  }

  function resetScene() {
    buildTower();
    spawnBalls();
  }

  const sceneEl = document.querySelector('a-scene');
  sceneEl.addEventListener('loaded', resetScene);

  // Desktop fallback: click to throw a ball from the camera
  const thrown = [];
  sceneEl.addEventListener('loaded', () => {
    window.addEventListener('mousedown', e => {
      if (sceneEl.is('vr-mode') || e.target.id === 'resetBtn') return;
      const cam = sceneEl.camera.el.object3D;
      const p = new THREE.Vector3(), d = new THREE.Vector3();
      cam.getWorldPosition(p);
      cam.getWorldDirection(d); d.negate();
      p.addScaledVector(d, 0.4);
      const ball = makeBall(p.x, p.y, p.z);
      thrown.push(ball);
      ball.addEventListener('body-loaded', () => {
        ball.body.velocity.set(d.x * 9, d.y * 9 + 1.5, d.z * 9);
      });
      if (thrown.length > 10) thrown.shift().remove();
    });
  });
</script>

</body>
</html>
