<!DOCTYPE html>
<html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>

<body>
<div id="bar"><button id="resetBtn">Reset Cans</button><button id="refillBtn">Refill Balls</button><button id="menuBtn">Menu</button></div>
<button id="helpBtn" title="Controls">?</button>
<div id="help"><b>Desktop</b><br>Click: throw &middot; Drag: look &middot; WASD: move<br>R: reset cans &middot; M: menu<br>
<b>VR</b><br>Trigger/Grip: grab &amp; throw &middot; A: reset cans<br>X: menu &middot; Y: refill balls &middot; B (hold): quit</div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// Real-world sizes (metres / kg): softball, standard 12 oz soda can, carnival counter height.
const BALL_RADIUS = 0.048;          // 9.6 cm softball
const BALL_MASS = 0.18;
const GRAB_RANGE = 0.25;
const TABLE_TOP = 0.9;
const PEDESTAL_TOP = 0.9;
const CAN_R = 0.033, CAN_H = 0.122; // 6.6 cm x 12.2 cm
const CAN_MASS = 0.1;               // weighted a little so a softball moves them like a carnival can
const THROW_ASSIST = 1.6;           // release speed multiplier: a relaxed flick carries a full throw
const MAX_THROW_SPEED = 18;         // m/s

// ---------- settings + local leaderboard (localStorage; falls back to memory if storage is blocked) ----------
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return k in mem ? mem[k] : d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { mem[k] = v; } },
};
const SETTINGS_KEY = 'cantoss.settings', BOARD_KEY = 'cantoss.leaderboard.v1';
const MIN_ROWS = 3, MAX_ROWS = 6, BOARD_SIZE = 10;
const settings = Object.assign({ rows: 4, quality: 'high', tutorialDone: false, name: 'AAA' }, store.get(SETTINGS_KEY, {}));
settings.rows = Math.min(MAX_ROWS, Math.max(MIN_ROWS, Math.round(+settings.rows) || 4));
if (settings.quality !== 'low') settings.quality = 'high';
settings.name = String(settings.name || 'AAA').toUpperCase().replace(/[^A-Z]/g, '').padEnd(3, 'A').slice(0, 3);
const saveSettings = () => store.set(SETTINGS_KEY, settings);
const canCount = (rows) => rows * (rows + 1) / 2;

// Score = cans x 50 x (throw efficiency + time efficiency), each efficiency capped at 2.
// Par is 0.8 throws per can and 6 s per can, so a par run scores cans x 100.
function computePoints(n, throws, time) {
  const parThrows = Math.ceil(n * 0.8), parTime = n * 6;
  const throwEff = Math.min(2, parThrows / Math.max(1, throws));
  const timeEff = Math.min(2, parTime / Math.max(1, time));
  return { points: Math.round(n * 50 * (throwEff + timeEff)), throwEff, timeEff, parThrows, parTime };
}

function sanitizeEntry(e) { // also used for imported files, so be strict
  if (!e || typeof e !== 'object') return null;
  const rows = Math.round(+e.rows), points = Math.round(+e.points), throws = Math.round(+e.throws), time = +e.time;
  if (!(rows >= MIN_ROWS && rows <= MAX_ROWS) || !(points >= 0 && points < 1e6)
      || !(throws >= 1 && throws < 1e4) || !(time >= 0 && time < 1e5)) return null;
  const name = String(e.name ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3) || '???';
  return { name, rows, cans: canCount(rows), points, throws, time: Math.round(time * 10) / 10,
           date: typeof e.date === 'string' ? e.date.replace(/[^0-9-]/g, '').slice(0, 10) : '' };
}
const better = (a, b) => b.points - a.points || a.time - b.time;
function trimBoard(list) {
  const out = [];
  for (let rows = MIN_ROWS; rows <= MAX_ROWS; rows++) out.push(...list.filter(e => e.rows === rows).sort(better).slice(0, BOARD_SIZE));
  return out;
}
function loadBoard() { const raw = store.get(BOARD_KEY, []); return (Array.isArray(raw) ? raw : []).map(sanitizeEntry).filter(Boolean); }
const topFor = (rows) => loadBoard().filter(e => e.rows === rows).sort(better);
function rankFor(rows, points, time) { // 1 = best; > BOARD_SIZE means it would not make the board
  return 1 + topFor(rows).filter(e => better({ points, time }, e) > 0).length;
}
function addScore(entry) {
  const e = sanitizeEntry({ ...entry, date: new Date().toISOString().slice(0, 10) });
  if (!e) return null;
  store.set(BOARD_KEY, trimBoard([...loadBoard(), e]));
  return e;
}
const exportBoard = () => JSON.stringify({ version: 1, entries: loadBoard() }, null, 2);
function importBoard(text) {
  let data;
  try { data = JSON.parse(text); } catch { return { added: 0, rejected: 0, error: 'Not valid JSON' }; }
  const list = Array.isArray(data) ? data : data && Array.isArray(data.entries) ? data.entries : null;
  if (!list) return { added: 0, rejected: 0, error: 'No entries found' };
  const key = (e) => [e.name, e.rows, e.points, e.throws, e.time, e.date].join('|');
  const have = loadBoard(), seen = new Set(have.map(key));
  let added = 0, rejected = 0;
  for (const raw of list.slice(0, 500)) {
    const e = sanitizeEntry(raw);
    if (!e) { rejected++; continue; }
    if (seen.has(key(e))) continue;
    seen.add(key(e)); have.push(e); added++;
  }
  store.set(BOARD_KEY, trimBoard(have));
  return { added, rejected };
}
const fmtTime = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}`;

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3ff);
scene.fog = new THREE.Fog(0xbfe3ff, 25, 90);
// reflections for the metal cans (generated in code, no downloads)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

scene.add(new THREE.HemisphereLight(0xdff1ff, 0x5a7a40, 0.9));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.position.set(-3, 6, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 20 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.01;
sun.target.position.set(0, 0.5, -3);
scene.add(sun, sun.target);

// The rig moves the player; in VR the headset pose is applied to the camera inside it.
const rig = new THREE.Group();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 200);
camera.position.set(0, 1.6, 0);
camera.rotation.order = 'YXZ';
rig.add(camera);
scene.add(rig);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- procedural textures (drawn on canvases: nothing to download) ----------
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const rnd = (a, b) => a + Math.random() * (b - a);

const grassTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#4f8a3e'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) {
    g.strokeStyle = `hsl(${rnd(85, 110)},${rnd(35, 55)}%,${rnd(22, 40)}%)`;
    const x = rnd(0, w), y = rnd(0, h);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + rnd(-2, 2), y - rnd(3, 8)); g.stroke();
  }
}, [24, 36]);

const woodTex = canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = '#9a6a38'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 160; i++) {
    g.strokeStyle = `rgba(${rnd(60, 90)},${rnd(35, 50)},${rnd(15, 25)},${rnd(0.1, 0.35)})`;
    g.lineWidth = rnd(0.5, 2.5);
    const y = rnd(0, h);
    g.beginPath(); g.moveTo(0, y);
    g.bezierCurveTo(w * 0.3, y + rnd(-6, 6), w * 0.6, y + rnd(-6, 6), w, y + rnd(-4, 4));
    g.stroke();
  }
});

function stripeTex(c1, c2, n, repeat) {
  return canvasTex(256, 64, (g, w, h) => {
    for (let i = 0; i < n; i++) { g.fillStyle = i % 2 ? c2 : c1; g.fillRect(i * w / n, 0, w / n + 1, h); }
  }, repeat);
}

function canTex(base, accent, name) {
  return canvasTex(512, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    g.fillStyle = accent; g.fillRect(0, h * 0.38, w, h * 0.24);
    g.fillStyle = '#d9dde0'; g.fillRect(0, 0, w, h * 0.1); g.fillRect(0, h * 0.9, w, h * 0.1);
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(w * 0.08, 0, w * 0.04, h); // highlight
    g.fillStyle = base === '#c0392b' ? '#fff' : '#1b2a6b';
    g.font = 'bold 54px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const u of [0.25, 0.75]) g.fillText(name, w * u, h * 0.5);
  });
}

const ballTex = canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = '#d6e64a'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#c0392b'; g.lineWidth = 3;
  for (const ph of [0, Math.PI]) {
    g.beginPath();
    for (let x = 0; x <= w; x += 4) {
      const y = h / 2 + h * 0.28 * Math.sin((x / w) * Math.PI * 2 + ph);
      x ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
    g.lineWidth = 1.5;
    for (let x = 0; x <= w; x += 9) { // stitches
      const y = h / 2 + h * 0.28 * Math.sin((x / w) * Math.PI * 2 + ph);
      g.beginPath(); g.moveTo(x, y - 6); g.lineTo(x + 3, y + 6); g.stroke();
    }
    g.lineWidth = 3;
  }
});

const signTex = (text, bg, fg, w = 512, h = 128) => canvasTex(w, h, (g) => {
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  g.strokeStyle = fg; g.lineWidth = 6; g.strokeRect(6, 6, w - 12, h - 12);
  g.fillStyle = fg; g.font = `bold ${h * 0.55}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, w / 2, h / 2 + 4);
});

const std = (opts) => new THREE.MeshStandardMaterial({ envMapIntensity: 0.35, ...opts });

// sky dome with a gradient (a background texture would be screen-locked in VR)
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(150, 24, 16),
  new THREE.MeshBasicMaterial({
    side: THREE.BackSide, fog: false,
    map: canvasTex(8, 256, (g, w, h) => {
      const gr = g.createLinearGradient(0, 0, 0, h);
      gr.addColorStop(0, '#2f6fc4'); gr.addColorStop(0.5, '#8fc3f0'); gr.addColorStop(1, '#dcefff');
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
    }),
  }));
scene.add(sky);

// ---------- physics ----------
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.8, 0) });
world.solver.iterations = 20;
world.allowSleep = true; // untouched cans sleep, so the pyramid stays exactly as built until hit

// Materials: tin cans, a softball, painted wood and grass behave differently.
const M = {
  ball: new CANNON.Material('ball'), can: new CANNON.Material('can'),
  wood: new CANNON.Material('wood'), grass: new CANNON.Material('grass'),
};
const contact = (a, b, friction, restitution) =>
  world.addContactMaterial(new CANNON.ContactMaterial(a, b, { friction, restitution }));
contact(M.ball, M.can, 0.3, 0.35);
contact(M.can, M.can, 0.4, 0.2);
contact(M.ball, M.wood, 0.4, 0.45);
contact(M.can, M.wood, 0.5, 0.15);
contact(M.ball, M.grass, 0.7, 0.3);
contact(M.can, M.grass, 0.6, 0.12);
contact(M.ball, M.ball, 0.3, 0.4);
world.defaultContactMaterial.friction = 0.5;
world.defaultContactMaterial.restitution = 0.1;

const dynamics = []; // { mesh, body }
const hands = [];
let simTime = 0;

// ---------- audio (synthesised with WebAudio; no sound files) ----------
const audio = { ctx: null, master: null, noise: null, log: [], recent: [] };

function ensureAudio() {
  if (audio.ctx) return audio.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  const ctx = audio.ctx = new AC();
  const comp = ctx.createDynamicsCompressor();
  audio.master = ctx.createGain();
  audio.master.gain.value = 0.9;
  audio.master.connect(comp).connect(ctx.destination);
  audio.noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const d = audio.noise.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return ctx;
}
function unlockAudio() { const c = ensureAudio(); if (c && c.state !== 'running') c.resume().catch(() => {}); }
for (const ev of ['pointerdown', 'keydown', 'touchstart']) window.addEventListener(ev, unlockAudio);
renderer.xr.addEventListener('sessionstart', () => {
  unlockAudio();
  setTimeout(() => { if (panel.open) placePanel(); }, 800); // re-place the first-run card once the headset pose is known
});

function tone(out, freq, t0, dur, gain, type = 'sine') {
  const ctx = audio.ctx, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(out);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseBurst(out, t0, dur, gain, freq, q = 1, type = 'bandpass', sweepTo) {
  const ctx = audio.ctx, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = audio.noise;
  f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
  if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f).connect(g).connect(out);
  s.start(t0, Math.random() * 0.5, dur + 0.05);
}

// A thin aluminium shell rings with inharmonic partials that die quickly; each can has its own pitch.
const CAN_PARTIALS = [[1, 0.30, 0.30], [2.32, 0.22, 0.18], [4.25, 0.14, 0.11], [6.63, 0.08, 0.06]]; // ratio, gain, decay s
const SOUNDS = {
  tin(out, t, v, pitch = rnd(1300, 1900)) { // metal can clink
    for (const [ratio, g, decay] of CAN_PARTIALS) tone(out, pitch * ratio, t, decay, g * v);
    tone(out, pitch * 0.5, t, 0.05, 0.18 * v, 'triangle');   // body "tonk"
    noiseBurst(out, t, 0.02, 0.55 * v, 5500, 1.2);            // metallic click
    noiseBurst(out, t, 0.06, 0.25 * v, 2800, 0.8);
  },
  thud(out, t, v) { // ball on wood / grass
    tone(out, rnd(90, 130), t, 0.12, 0.55 * v);
    noiseBurst(out, t, 0.06, 0.35 * v, 700, 0.7, 'lowpass');
  },
  hit(out, t, v, pitch) { // softball hits a can: dull thump + ring
    SOUNDS.tin(out, t, v, pitch);
    tone(out, 170, t, 0.07, 0.35 * v);
    noiseBurst(out, t, 0.04, 0.3 * v, 900, 0.7, 'lowpass');
  },
  canfloor(out, t, v, pitch) { // can lands on wood / grass: short clank, mostly damped
    SOUNDS.tin(out, t, v * 0.55, (pitch || 1500) * 0.85);
    noiseBurst(out, t, 0.05, 0.3 * v, 1200, 0.7, 'lowpass');
  },
  whoosh(out, t, v) { noiseBurst(out, t, 0.35, 0.5 * v, 350, 1.5, 'bandpass', 1800); },
  grab(out, t, v) { tone(out, 520, t, 0.05, 0.15, 'triangle'); noiseBurst(out, t, 0.03, 0.1, 2000); },
  click(out, t, v) { tone(out, 880, t, 0.04, 0.12, 'triangle'); },
  pop(out, t, v) { // confetti cannon
    noiseBurst(out, t, 0.09, 0.8 * v, 1800, 0.6);
    tone(out, 140, t, 0.12, 0.6 * v);
  },
  boom(out, t, v) { // firework burst + crackle
    noiseBurst(out, t, 0.8, 0.9 * v, 900, 0.5, 'lowpass', 90);
    tone(out, 60, t, 0.5, 0.7 * v);
    for (let i = 0; i < 14; i++) noiseBurst(out, t + 0.15 + Math.random() * 0.9, 0.025, 0.25 * v, 5000 + Math.random() * 3000, 0.8, 'highpass');
  },
  cheer(out, t, v) { // crowd: swelling, wobbling band of noise
    const ctx = audio.ctx, src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    src.buffer = audio.noise; src.loop = true;
    f.type = 'bandpass'; f.frequency.setValueAtTime(900, t); f.frequency.linearRampToValueAtTime(1500, t + 1.2); f.Q.value = 0.6;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.32 * v, t + 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
    lfo.frequency.value = 6.5; lg.gain.value = 0.07 * v;
    lfo.connect(lg).connect(g.gain);
    src.connect(f).connect(g).connect(out);
    src.start(t); src.stop(t + 2.9); lfo.start(t); lfo.stop(t + 2.9);
  },
  win(out, t) { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(out, f, t + i * 0.11, 0.5, 0.22, 'triangle')); },
};
const _lp = new THREE.Vector3();
function play(type, pos, strength = 1, pitch) {
  audio.log.push({ type, strength, pitch });
  if (audio.log.length > 500) audio.log.shift();
  const ctx = audio.ctx;
  if (!ctx || ctx.state !== 'running') return;
  const now = performance.now();
  audio.recent = audio.recent.filter(t => now - t < 100);
  if (audio.recent.length > 10) return; // keep a pile-up of cans from clipping
  audio.recent.push(now);
  let out = audio.master;
  if (pos) {
    const p = ctx.createPanner();
    p.panningModel = 'HRTF'; p.distanceModel = 'inverse'; p.refDistance = 1.5; p.rolloffFactor = 0.7;
    if (p.positionX) { p.positionX.value = pos.x; p.positionY.value = pos.y; p.positionZ.value = pos.z; }
    p.connect(audio.master);
    out = p;
  }
  SOUNDS[type](out, ctx.currentTime, Math.max(0.06, Math.min(1, strength)), pitch);
}
function updateListener() {
  const ctx = audio.ctx;
  if (!ctx || !ctx.listener.positionX) return;
  const L = ctx.listener, q = camera.getWorldQuaternion(new THREE.Quaternion());
  const p = camera.getWorldPosition(_lp);
  const f = new THREE.Vector3(0, 0, -1).applyQuaternion(q), u = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
  L.positionX.value = p.x; L.positionY.value = p.y; L.positionZ.value = p.z;
  L.forwardX.value = f.x; L.forwardY.value = f.y; L.forwardZ.value = f.z;
  L.upX.value = u.x; L.upY.value = u.y; L.upZ.value = u.z;
}

// collisions -> sounds (each pair is handled once, by the body with the higher id)
function onCollide(self) {
  return (e) => {
    const o = e.body;
    if (o.mass > 0 && o.id < self.id) return;
    const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
    if (v < 0.35) return;
    const k = [self.kind, o.kind];
    const has = (x) => k.includes(x);
    const vol = v / 6;
    if (has('can') && has('ball')) {
      play('hit', self.position, vol, self.kind === 'can' ? self.pitch : o.pitch);
    } else if (k[0] === 'can' && k[1] === 'can') {
      play('tin', self.position, vol, self.pitch);
      play('tin', o.position, vol * 0.8, o.pitch);
    } else if (has('can')) {
      play('canfloor', self.position, vol, self.pitch);
    } else {
      play('thud', self.position, vol);
    }
  };
}

// ---------- the booth ----------

// ---------- cans and balls ----------
const cans = [];
const balls = [];

function track(mesh, body, list) {
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
  world.addBody(body);
  const item = { mesh, body, heldBy: null };
  dynamics.push(item);
  list.push(item);
  return item;
}
function removeItem(item, list) { // geometry and materials are shared, so only unregister
  if (list === balls && item.slot !== null) { // a slot ball left the world: refill its slot
    const i = item.slot; item.slot = null; slots[i] = null;
    refillQueue.push({ slot: i, at: simTime + 0.7 });
  }
  scene.remove(item.mesh);
  world.removeBody(item.body);
  dynamics.splice(dynamics.indexOf(item), 1);
  list.splice(list.indexOf(item), 1);
}

const canGeo = new THREE.CylinderGeometry(CAN_R, CAN_R, CAN_H, 32);
const capMat = std({ color: 0xd5d9dc, metalness: 0.9, roughness: 0.28, envMapIntensity: 1 });
const canMats = [
  [std({ map: canTex('#c0392b', '#f4efe6', 'COLA'), metalness: 0.75, roughness: 0.3, envMapIntensity: 1 }), capMat, capMat],
  [std({ map: canTex('#c8ccd0', '#2e86c1', 'SODA'), metalness: 0.85, roughness: 0.28, envMapIntensity: 1 }), capMat, capMat],
];
function makeCan(x, y, z, i) {
  const mesh = new THREE.Mesh(canGeo, canMats[i % 2]);
  // Box collider slightly inside the visual cylinder: cannon's cylinder contacts jitter,
  // which makes stacked cans creep and topple on their own.
  const he = CAN_R * 0.97;
  const body = new CANNON.Body({
    mass: CAN_MASS, material: M.can, linearDamping: 0.1, angularDamping: 0.3,
    shape: new CANNON.Box(new CANNON.Vec3(he, CAN_H / 2, he)),
  });
  body.kind = 'can';
  body.pitch = rnd(1200, 1900);
  body.allowSleep = true; body.sleepSpeedLimit = 0.08; body.sleepTimeLimit = 0.4;
  body.position.set(x, y, z);
  body.addEventListener('collide', onCollide(body));
  return track(mesh, body, cans);
}

const ballGeo = new THREE.SphereGeometry(BALL_RADIUS, 32, 20);
const ballMat = std({ map: ballTex, roughness: 0.75, envMapIntensity: 0.25 });
function makeBall(x, y, z) {
  const mesh = new THREE.Mesh(ballGeo, ballMat);
  const body = new CANNON.Body({
    mass: BALL_MASS, material: M.ball, linearDamping: 0.01, angularDamping: 0.15, allowSleep: false,
    shape: new CANNON.Sphere(BALL_RADIUS),
  });
  body.kind = 'ball';
  body.position.set(x, y, z);
  body.addEventListener('collide', onCollide(body));
  const item = track(mesh, body, balls);
  item.slot = null;
  return item;
}

// Four slots on the stand. Taking a ball leaves its slot empty and a fresh ball appears there shortly after.
const SLOT_POS = [0, 1, 2, 3].map(i => [(i - 1.5) * 0.15, PEDESTAL_TOP + BALL_RADIUS + 0.01, -0.8]);
const slots = [null, null, null, null];
const refillQueue = []; // { slot, at }
const MAX_LOOSE_BALLS = 10;

function fillSlot(i) {
  const b = makeBall(...SLOT_POS[i]);
  b.slot = i; slots[i] = b;
  return b;
}
function freeSlotOf(ball) {
  if (ball.slot === null) return;
  const i = ball.slot;
  ball.slot = null; slots[i] = null;
  refillQueue.push({ slot: i, at: simTime + 0.7 });
}
function updateRefills() {
  for (let k = refillQueue.length - 1; k >= 0; k--) {
    const q = refillQueue[k];
    if (slots[q.slot]) { refillQueue.splice(k, 1); continue; }
    if (simTime < q.at) continue;
    const [x, y, z] = SLOT_POS[q.slot];
    const blocked = balls.some(b => Math.hypot(b.mesh.position.x - x, b.mesh.position.y - y, b.mesh.position.z - z) < BALL_RADIUS * 1.6);
    if (blocked) continue; // a ball (or a hand) is still in the way; try again next frame
    refillQueue.splice(k, 1);
    fillSlot(q.slot);
  }
  // keep memory bounded: drop the oldest loose balls
  const loose = balls.filter(b => b.slot === null && !b.heldBy);
  if (loose.length > MAX_LOOSE_BALLS) removeItem(loose[0], balls);
}

// Triangle pyramid with settings.rows rows (3..6 => 6, 10, 15 or 21 cans): every can sits centred on the two below it.
function buildTower() {
  while (cans.length) removeItem(cans[0], cans);
  const rows = settings.rows, s = CAN_R * 2 + 0.006, gap = 0.001;
  const y0 = TABLE_TOP + CAN_H / 2 + gap;
  let id = 0;
  for (let row = 0; row < rows; row++) {
    const n = rows - row;
    for (let i = 0; i < n; i++) {
      const c = makeCan((i - (n - 1) / 2) * s, y0 + row * (CAN_H + gap), -4, id++);
      c.body.sleep(); // stays perfectly still until something hits it
    }
  }
}

function spawnBalls() {
  for (const h of hands) h.held = null;
  while (balls.length) removeItem(balls[0], balls);
  slots.fill(null); refillQueue.length = 0;
  for (let i = 0; i < 4; i++) fillSlot(i);
}

function resetCans() { // the pyramid only: balls are left alone
  buildTower();
  Object.assign(score, { down: 0, throws: 0, won: false, t0: null, time: 0 });
  winPanelAt = null;
  if (panel.open && panel.screen === 'result') closePanel();
  drawBoard();
}
function resetScene() { resetCans(); spawnBalls(); }
function setRows(n) {
  settings.rows = Math.min(MAX_ROWS, Math.max(MIN_ROWS, n));
  panel.viewRows = settings.rows;
  saveSettings();
  resetCans();
  bump();
}

document.getElementById('refillBtn').addEventListener('click', spawnBalls);
document.getElementById('helpBtn').addEventListener('click', () => document.getElementById('help').classList.toggle('open'));

let winPanelAt = null;
function updateScore() {
  let down = 0;
  for (const c of cans) {
    const q = c.body.quaternion;
    const upY = 1 - 2 * (q.x * q.x + q.z * q.z); // how upright the can is
    if (c.body.position.y < TABLE_TOP - 0.03 || upY < 0.5) down++;
  }
  score.down = down;
  if (down === cans.length && cans.length > 0 && !score.won) onWin();
  drawBoard();
}

function onWin() {
  score.time = score.t0 === null ? 0 : (performance.now() - score.t0) / 1000;
  score.won = true;
  const throws = Math.max(1, score.throws), time = Math.max(1, score.time);
  const res = computePoints(cans.length, throws, time);
  panel.result = { ...res, n: cans.length, rows: settings.rows, throws, time: score.time,
                   rank: rankFor(settings.rows, res.points, score.time), saved: false };
  celebrate();
  winPanelAt = simTime + 3.2; // let the celebration play before the result card appears
  drawBoard();
}

// ---------- VR hands: grab with trigger or grip, throw on release ----------
const tmp = new THREE.Vector3(), _v = new THREE.Vector3(), camPos = new THREE.Vector3(), camDir = new THREE.Vector3();
const controllerModels = new XRControllerModelFactory();

function tipTexture(lines) {
  const w = 420, h = 40 + lines.length * 44;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(15,15,20,0.82)';
  g.beginPath(); g.roundRect(2, 2, w - 4, h - 4, 18); g.fill();
  g.strokeStyle = '#ffe9a8'; g.lineWidth = 3; g.stroke();
  g.font = 'bold 28px sans-serif'; g.textBaseline = 'middle';
  lines.forEach(([key, text], i) => {
    const y = 40 + i * 44;
    g.fillStyle = '#ffe9a8'; g.textAlign = 'left'; g.fillText(key, 18, y);
    g.fillStyle = '#fff'; g.font = '26px sans-serif'; g.fillText(text, 150, y); g.font = 'bold 28px sans-serif';
  });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return { tex: t, aspect: w / h };
}
const TIPS = {
  right: [['TRIGGER', 'grab / throw'], ['GRIP', 'grab / throw'], ['A', 'reset cans'], ['B (hold)', 'quit VR']],
  left:  [['TRIGGER', 'grab / throw'], ['GRIP', 'grab / throw'], ['X', 'menu'], ['Y', 'refill balls']],
};

for (let i = 0; i < 2; i++) {
  const ctrl = renderer.xr.getController(i);
  const hand = { ctrl, held: null, hover: -1, handedness: null, connectedAt: null, tip: null, marker: null, laser: null,
                 prev: new THREE.Vector3(), vel: new THREE.Vector3(), hasPrev: false, hist: [] };
  rig.add(ctrl);
  const grip = renderer.xr.getControllerGrip(i);
  const model = controllerModels.createControllerModel(grip);
  grip.add(model); // the real controller model: nothing is drawn over its buttons
  rig.add(grip);
  hand.model = model;

  // Only if the model cannot be downloaded: a small stand-in controller so there is still a hand to see.
  hand.marker = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.12), std({ color: 0x333333, roughness: 0.5 }));
  hand.marker.visible = false;
  grip.add(hand.marker);

  // pointer line, only visible while aiming at the menu panel
  hand.laser = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0xffe9a8 }));
  hand.laser.visible = false;
  ctrl.add(hand.laser);

  ctrl.addEventListener('connected', (e) => {
    hand.handedness = (e.data && e.data.handedness) || (i === 0 ? 'left' : 'right');
    hand.connectedAt = simTime;
    if (hand.tip) { ctrl.remove(hand.tip); hand.tip.material.map.dispose(); }
    const { tex, aspect } = tipTexture(TIPS[hand.handedness] || TIPS.right);
    hand.tip = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0 }));
    hand.tip.visible = false; // fades in only when you hold the controller up and look at it
    hand.tip.scale.set(0.2 * aspect, 0.2, 1);
    hand.tip.position.set(0, 0.17, 0.03); // floats above the controller, clear of its buttons
    ctrl.add(hand.tip);
  });
  for (const [down, up] of [['selectstart', 'selectend'], ['squeezestart', 'squeezeend']]) {
    ctrl.addEventListener(down, () => {
      unlockAudio();
      if (down === 'selectstart' && hand.hover >= 0) { activatePanel(hand.hover); return; } // pressing a menu button
      grab(hand);
    });
    ctrl.addEventListener(up, () => release(hand));
  }
  hands.push(hand);
}

function grab(hand) {
  if (hand.held) return;
  hand.ctrl.getWorldPosition(tmp);
  let best = null, bestD = GRAB_RANGE;
  for (const b of balls) {
    if (b.heldBy) continue;
    const d = tmp.distanceTo(b.mesh.position);
    if (d < bestD) { best = b; bestD = d; }
  }
  if (best) {
    hand.held = best; best.heldBy = hand;
    freeSlotOf(best); // a new ball appears on the stand in its place
    play('grab', best.mesh.position, 0.6);
    haptic(hand, 0.3, 40);
    if (panel.open && panel.screen !== 'result') closePanel(); // getting on with the game dismisses the menu
  }
}

// Hand velocity over the last ~100 ms (falls back to the last two samples at low frame rates).
function handVelocity(hand, out) {
  const h = hand.hist;
  if (h.length < 2) return out.set(0, 0, 0);
  const last = h[h.length - 1];
  let first = h[h.length - 2];
  for (let i = h.length - 2; i >= 0 && last.t - h[i].t <= 0.1; i--) first = h[i];
  const dt = last.t - first.t;
  return dt > 0 ? out.copy(last.p).sub(first.p).multiplyScalar(1 / dt) : out.set(0, 0, 0);
}

function release(hand) {
  const b = hand.held;
  if (!b) return;
  hand.held = null;
  b.heldBy = null;
  const v = handVelocity(hand, new THREE.Vector3()).multiplyScalar(THROW_ASSIST);
  if (v.length() > MAX_THROW_SPEED) v.setLength(MAX_THROW_SPEED);
  b.body.velocity.set(v.x, v.y, v.z);
  b.body.wakeUp();
  if (v.length() > 1.5) {
    registerThrow();
    play('whoosh', b.mesh.position, v.length() / 12);
  }
}

function updateHands(dt) {
  simTime += dt;
  camera.getWorldPosition(camPos); camera.getWorldDirection(camDir);
  for (const h of hands) {
    h.ctrl.getWorldPosition(tmp);
    h.hist.push({ t: simTime, p: tmp.clone() });
    while (h.hist.length > 12 || (h.hist.length > 2 && simTime - h.hist[0].t > 0.3)) h.hist.shift();
    handVelocity(h, h.vel);
    if (h.held) {
      h.held.body.position.set(tmp.x, tmp.y, tmp.z);
      h.held.body.velocity.set(0, 0, 0);
      h.held.body.angularVelocity.set(0, 0, 0);
    }
    if (h.tip) { // hint card: only while the controller is held close in front of your face
      _v.copy(tmp).sub(camPos);
      const dist = _v.length(), looking = dist < 0.5 && _v.normalize().dot(camDir) > 0.9 && !h.held;
      const m = h.tip.material;
      m.opacity += ((looking ? 0.95 : 0) - m.opacity) * Math.min(1, dt * 8);
      h.tip.visible = m.opacity > 0.03;
    }
    h.marker.visible = h.connectedAt !== null && !h.model.motionController && simTime - h.connectedAt > 5;
  }
}

// ---------- haptics ----------
function haptic(hand, intensity = 0.5, ms = 80) { // hand = a hand object, or null for both
  const session = renderer.xr.getSession();
  if (!session) return;
  for (const src of session.inputSources) {
    if (hand && src.handedness !== hand.handedness) continue;
    try {
      const gp = src.gamepad, act = gp && gp.hapticActuators && gp.hapticActuators[0];
      if (act && act.pulse) act.pulse(intensity, ms);
      else if (gp && gp.vibrationActuator) gp.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: intensity, weakMagnitude: intensity });
    } catch { /* haptics are optional */ }
  }
}

// Controller buttons while in VR: A reset cans, B (hold) quit, X menu, Y refill balls.
// Quest layout: buttons[4] = A / X, buttons[5] = B / Y.
const latch = {};
let quitHold = 0;
const QUIT_HOLD = 1.0; // seconds
function pollVRButtons(dt) {
  const session = renderer.xr.getSession();
  if (!session) { quitHold = 0; return; }
  let bRight = false;
  const edge = (id, pressed) => { const was = latch[id]; latch[id] = pressed; return pressed && !was; };
  for (const src of session.inputSources) {
    const b = src.gamepad && src.gamepad.buttons;
    if (!b) continue;
    const p4 = !!(b[4] && b[4].pressed), p5 = !!(b[5] && b[5].pressed);
    if (src.handedness === 'right') {
      if (edge('A', p4)) { play('click', null, 0.8); resetCans(); }
      bRight = p5;
    } else if (src.handedness === 'left') {
      if (edge('X', p4)) togglePanel();
      if (edge('Y', p5)) { play('click', null, 0.8); spawnBalls(); }
    }
  }
  quitHold = bRight ? quitHold + dt : 0;
  const status = bRight ? `Hold B to quit VR… ${Math.min(100, Math.round(quitHold / QUIT_HOLD * 100))}%` : '';
  if (status !== panel.status) { panel.status = status; bump(); }

}

function updateFX(dt) {
  // scheduled confetti rain + rockets
  for (let k = FX.rainWaves.length - 1; k >= 0; k--) {
    const w = FX.rainWaves[k];
    if (simTime < w.at) continue;
    for (let i = 0; i < w.n; i++) emitConfetti(rnd(-2.2, 2.2), rnd(3, 3.6), rnd(-5, -1.5), rnd(-0.4, 0.4), rnd(-1.8, -0.6), rnd(-0.4, 0.4), 6);
    FX.rainWaves.splice(k, 1);
  }
  for (let k = FX.fireworks.length - 1; k >= 0; k--) {
    const f = FX.fireworks[k];
    if (simTime < f.at) continue;
    sBurst[emitSpark(f.x, 0.3, f.z, 0, 9, 0, 1.0, ROCKET_COLOR, 1)] = { color: f.color, n: f.n };
    FX.fireworks.splice(k, 1);
  }

  let live = 0;
  for (let i = 0; i < CONFETTI_MAX; i++) {
    if (cLife[i] <= 0) continue;
    live++;
    const o = i * 3;
    cLife[i] -= dt;
    const onGround = cPos[o + 1] <= 0.015;
    if (!onGround) {
      cVel[o + 1] -= 3.2 * dt;                                  // light paper: gentle gravity
      const drag = Math.max(0, 1 - 1.8 * dt);
      cVel[o] *= drag; cVel[o + 2] *= drag; if (cVel[o + 1] < -1.2) cVel[o + 1] = -1.2; // terminal velocity
      cVel[o] += Math.sin(cLife[i] * 9 + i) * 0.6 * dt;         // flutter
      cPos[o] += cVel[o] * dt; cPos[o + 1] += cVel[o + 1] * dt; cPos[o + 2] += cVel[o + 2] * dt;
      cRot[o] += cSpin[o] * dt; cRot[o + 1] += cSpin[o + 1] * dt; cRot[o + 2] += cSpin[o + 2] * dt;
      if (cPos[o + 1] < 0.015) cPos[o + 1] = 0.015;
    }
    dummy.position.set(cPos[o], cPos[o + 1], cPos[o + 2]);
    dummy.rotation.set(onGround ? -Math.PI / 2 : cRot[o], cRot[o + 1], cRot[o + 2]);
    dummy.scale.setScalar(cLife[i] > 0 ? Math.min(1, cLife[i] / 0.6) : 0);
    dummy.updateMatrix();
    confettiMesh.setMatrixAt(i, dummy.matrix);
  }
  if (live || FX.confettiLive) confettiMesh.instanceMatrix.needsUpdate = true;
  FX.confettiLive = live;

  live = 0;
  for (let i = 0; i < SPARK_MAX; i++) {
    if (sLife[i] <= 0) continue;
    live++;
    const o = i * 3;
    sLife[i] -= dt;
    if (sRocket[i]) {
      sVel[o + 1] -= 5 * dt;
      emitSpark(sPos[o], sPos[o + 1], sPos[o + 2], rnd(-0.3, 0.3), rnd(-1, 0), rnd(-0.3, 0.3), 0.4, TRAIL_COLOR); // trail
    } else {

    }
    sPos[o] += sVel[o] * dt; sPos[o + 1] += sVel[o + 1] * dt; sPos[o + 2] += sVel[o + 2] * dt;

      if (sRocket[i] && sBurst[i]) { burst(px, py, pz, sBurst[i].color, sBurst[i].n); sBurst[i] = null; }
      continue;
    }
    const f = Math.pow(sLife[i] / sMax[i], 1.3);
    sCol[o] = sBase[o] * f; sCol[o + 1] = sBase[o + 1] * f; sCol[o + 2] = sBase[o + 2] * f;
  }
  if (live || FX.sparksLive) { sGeo.attributes.position.needsUpdate = true; sGeo.attributes.color.needsUpdate = true; }
  FX.sparksLive = live;

  // banner: pop in, hold, fade
  if (FX.bannerAt !== null) {
    const t = simTime - FX.bannerAt;
    if (t > 5.5) { banner.visible = false; FX.bannerAt = null; }
    else {
      banner.visible = true;
      const pop = t < 0.5 ? 1 + 2.70158 * Math.pow(t / 0.5 - 1, 3) + 1.70158 * Math.pow(t / 0.5 - 1, 2) : 1; // ease-out-back
      const s = Math.max(0.001, pop) * (1 + 0.03 * Math.sin(t * 6));
      banner.scale.set(1.6 * s, 0.4 * s, 1);
      banner.material.opacity = t > 4.5 ? Math.max(0, 5.5 - t) : 1;
    }
  }
}

// ---------- main loop ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  moveDesktop(dt);
  pollVRButtons(dt);
  updateHands(dt);
  updatePanel();
  updateRefills();
  updateFX(dt);
  if (winPanelAt !== null && simTime >= winPanelAt) { winPanelAt = null; openPanel('result'); }
  // small fixed step: a 9.6 cm ball at ~10 m/s must not tunnel through 6.6 cm cans
  world.step(1 / 240, dt, 12);
  for (const { mesh, body } of dynamics) {
    mesh.position.copy(body.position);
    mesh.quaternion.copy(body.quaternion);
  }
  // balls that fall off the world are removed (a slot ball is replaced on the stand)
  for (const b of balls) {
    if (b.body.position.y < -3 && !b.heldBy) { removeItem(b, balls); break; }
  }
  updateScore();
  updateListener();
  renderer.render(scene, camera);
});

resetScene();
setQuality(settings.quality);
if (!settings.tutorialDone) openPanel('controls'); // first run only

// handle for tests / debugging
window.game = { THREE, scene, camera, rig, renderer, world, cans, balls, slots, hands, score, audio, panel, menuMesh, settings, FX, banner,
  play, resetScene, resetCans, spawnBalls, throwBall, grab, release, quitVR, openPanel, closePanel, togglePanel, setRows, setQuality,
  computePoints, addScore, topFor, loadBoard, exportBoard, importBoard, rankFor, celebrate, getSimTime: () => simTime };
</script>
